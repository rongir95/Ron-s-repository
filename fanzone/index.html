<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FanZone Prototype</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- The stage is designed at 1288×596 (mobile landscape) and scaled to fit the window -->
  <div class="viewport">
    <div class="stage" id="stage">

      <!-- VIDEO -->
      <div class="video" id="video">
        <video src="assets/video/match-bg.mp4" autoplay muted loop playsinline aria-label="Live match"></video>

        <!-- Broadcaster bug -->
        <svg class="broadcaster" width="52" height="52" viewBox="0 0 100 100" fill="none" role="img" aria-label="DAZN"><g opacity="0.7"><path d="M25.35 82.6C25.0852 82.259 24.96 81.8299 25 81.4V78.1C25.0139 77.6764 25.1727 77.2705 25.45 76.95L37.2 60.25H26.6C26.1826 60.3351 25.7487 60.2447 25.4 60C25.0932 59.5443 24.952 58.9972 25 58.45V56.05C24.9447 55.5471 25.0497 55.0396 25.3 54.6C25.6331 54.3201 26.0686 54.193 26.5 54.25H43.65C44.1355 54.217 44.6206 54.3209 45.05 54.55C45.3274 54.904 45.4533 55.3534 45.4 55.8V59C45.4531 59.1965 45.4531 59.4035 45.4 59.6C45.312 59.8309 45.1944 60.0494 45.05 60.25L33.15 76.95H44.45C45.1 76.95 45.5 76.95 45.65 77.3C45.9033 77.7202 46.0089 78.2129 45.95 78.7V81.15C46.0089 81.637 45.9033 82.1298 45.65 82.55C45.65 82.55 45.1 82.9 44.45 82.9H26.75C26.2633 82.9515 25.7729 82.8464 25.35 82.6ZM25 44.2V18.6C25 18.6 25 17.7 25.35 17.4C25.7856 17.1885 26.266 17.0855 26.75 17.1H35C37.9182 17.0457 40.7522 18.0795 42.95 20C44.9668 22.1258 46.0473 24.9713 45.95 27.9V34.2C46.0533 37.3056 45.1015 40.3546 43.25 42.85C41.3179 44.7409 38.7026 45.769 36 45.7H26.75C26.75 45.7 25.7 45.7 25.35 45.4C25.1142 45.0448 24.9922 44.6263 25 44.2ZM31.6 40H35C36.1407 40.094 37.2724 39.7348 38.15 39C39.45 37.7 39.3 34 39.3 34V28.5C39.3648 26.8724 38.966 25.2598 38.15 23.85C37.2874 23.0751 36.1589 22.6632 35 22.7H31.6V40ZM73.45 54.15H70.75C70.265 54.1246 69.782 54.2281 69.35 54.45C69.1152 54.8223 69.0097 55.2617 69.05 55.7V70.7L61.05 55.7C60.8828 55.2157 60.5681 54.7961 60.15 54.5C59.635 54.2596 59.0667 54.1562 58.5 54.2H56C55.515 54.1746 55.032 54.2781 54.6 54.5C54.3652 54.8723 54.2597 55.3117 54.3 55.75V81.35C54.2506 81.7732 54.3573 82.1999 54.6 82.55C55.0017 82.8033 55.4788 82.9094 55.95 82.85H58.7C59.1867 82.9015 59.6771 82.7964 60.1 82.55C60.3648 82.209 60.49 81.7799 60.45 81.35V66.35L68.4 81.35C68.5831 81.8531 68.9143 82.2888 69.35 82.6C69.8776 82.7106 70.4224 82.7106 70.95 82.6H73.45C73.9367 82.6515 74.4271 82.5464 74.85 82.3C75.1148 81.959 75.24 81.5299 75.2 81.1V55.8C75.2295 55.3556 75.106 54.9145 74.85 54.55C74.418 54.3281 73.935 54.2246 73.45 54.25V54.15ZM52.35 44L60.85 18.45C60.9565 18.0428 61.183 17.6769 61.5 17.4C61.8582 17.1757 62.2783 17.0707 62.7 17.1H67.35C67.7722 17.0634 68.1946 17.1689 68.55 17.4C68.8203 17.7048 69.0246 18.0623 69.15 18.45L77.6 44C77.7722 44.4162 77.7722 44.8838 77.6 45.3C77.3485 45.5838 76.9778 45.7321 76.6 45.7H72.6C72.1641 45.763 71.7273 45.5921 71.45 45.25C71.2277 44.8578 71.0595 44.4373 70.95 44L69.6 39.7H60L58.7 44C58.5582 44.5378 58.3211 45.0459 58 45.5C57.7 45.75 56.7 45.5 56.7 45.5H53.25C53.25 45.5 52.5 45.5 52.25 45.05C52.1807 44.6977 52.2155 44.3329 52.35 44ZM61.55 34.55H68.05L65 23.75L61.55 34.55ZM100 44.15L94.2 50L100 55.8V100H0V55.8L5.8 50L0 44.2V0H100V44.15ZM93.75 6.25H6.25V41.25L13.2 48.2C14.2035 49.2292 14.2035 50.8708 13.2 51.9L6.25 58.8V93.8H93.75V58.8L86.8 51.85C86.2924 51.3685 86.005 50.6996 86.005 50C86.005 49.3004 86.2924 48.6315 86.8 48.15L93.75 41.2V6.25Z" fill-rule="evenodd" clip-rule="evenodd" fill="#F9FAFA"/></g></svg>

        <!-- FanZone launcher (hidden while the panel is open) -->
        <button class="launcher" id="launcher" aria-label="Open FanZone">
          <span class="launcher-icon in" id="iconChat" aria-hidden="true">
            <svg width="36" height="36" viewBox="0 0 24 24">
              <path d="M12 3C6.9 3 3 6.4 3 10.6c0 2.3 1.2 4.4 3.1 5.8L5.4 20.4c-.1.5.4.9.9.6l4.1-2.4c.5.1 1 .1 1.6.1 5.1 0 9-3.4 9-7.6S17.1 3 12 3z" fill="#0A1016"/>
              <circle cx="8.2" cy="10.8" r="1.35" fill="#FFFFFF"/><circle cx="12" cy="10.8" r="1.35" fill="#FFFFFF"/><circle cx="15.8" cy="10.8" r="1.35" fill="#FFFFFF"/>
            </svg>
          </span>
          <span class="launcher-icon out-right" id="iconPoll" aria-hidden="true">
            <svg width="30" height="30" viewBox="0 0 40 40"><rect class="bar b1" x="4" y="5" width="30" height="8" rx="2" fill="#0A1016"/><rect class="bar b2" x="4" y="16" width="22" height="8" rx="2" fill="#0A1016"/><rect class="bar b3" x="4" y="27" width="10" height="8" rx="2" fill="#0A1016"/></svg>
          </span>
          <span class="launcher-dot" id="launcherDot" hidden></span>
        </button>
      </div>

      <!-- FANZONE PANEL -->
      <aside class="panel" id="panel" aria-label="FanZone" aria-hidden="true">
        <header class="panel-header">
          <h1>FanZone</h1>
          <div class="panel-actions">
            <button class="icon-btn" aria-label="Leaderboard">
              <svg width="36" height="36" viewBox="0 0 32 32" fill="none" aria-hidden="true"><path d="M19.7451 7.66895C20.8953 7.66939 21.8291 8.60164 21.8291 9.75195V10.1641H22.2451C23.3952 10.1645 24.3279 11.0969 24.3281 12.2471V13.4141C24.3281 14.1891 24.1378 14.9693 23.7568 15.5791C23.3782 16.1848 22.7722 16.6639 22.0156 16.6641H21.7998C21.4779 19.2804 19.4231 21.3589 16.8184 21.7178C16.8232 21.7541 16.8271 21.7915 16.8271 21.8291V22.665H18.5557C19.0155 22.6655 19.3886 23.0381 19.3887 23.498C19.3887 23.958 19.0155 24.3306 18.5557 24.3311H13.4414C12.9812 24.331 12.6084 23.9583 12.6084 23.498C12.6084 23.0379 12.9812 22.6651 13.4414 22.665H15.1611V21.8291C15.1611 21.7895 15.1636 21.75 15.1689 21.7119C12.5853 21.3356 10.5535 19.2655 10.2334 16.6641H9.98535C9.22859 16.6641 8.62288 16.1848 8.24414 15.5791C7.86311 14.9693 7.67288 14.1892 7.67285 13.4141V12.2471C7.67303 11.0967 8.60552 10.1642 9.75586 10.1641H10.1689V9.75195C10.1689 8.60136 11.1014 7.66895 12.252 7.66895H19.7451ZM12.252 9.33496C12.0218 9.33496 11.835 9.52183 11.835 9.75195V14.7363L11.8535 15.9326V15.9453C11.8537 18.2441 13.7178 20.1074 16.0166 20.1074C18.311 20.1069 20.1723 18.2501 20.1787 15.957L20.1621 14.7617V9.75195C20.1621 9.52211 19.9749 9.33541 19.7451 9.33496H12.252ZM9.75586 11.6641C9.43395 11.6642 9.17303 11.9252 9.17285 12.2471V13.4141C9.17288 13.9647 9.31179 14.4564 9.5166 14.7842C9.72381 15.1155 9.91355 15.1641 9.98535 15.1641H10.1748L10.1689 14.7627V11.6641H9.75586ZM21.8291 14.7383L21.835 15.1641H22.0156C22.0878 15.1638 22.2776 15.1149 22.4844 14.7842C22.6891 14.4564 22.8281 13.9646 22.8281 13.4141V12.2471C22.8279 11.9253 22.5668 11.6645 22.2451 11.6641H21.8291V14.7383Z" fill="#F9FAFA"/></svg>
            </button>
            <span class="divider"></span>
            <button class="icon-btn" id="closeBtn" aria-label="Close FanZone">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M4 4l16 16M20 4L4 20"/></svg>
            </button>
          </div>
        </header>

        <div class="panel-body">
          <!-- Live chat (always running) -->
          <div class="chat" id="chat"></div>

          <!-- Poll card (overlays the top of the chat) -->
          <section class="card" id="pollCard">
            <div class="card-head">
              <div class="card-title">
                <svg width="28" height="28" viewBox="0 0 100 100" fill="none" aria-hidden="true"><path d="M64.2857 20.8332C64.2857 18.532 62.6867 16.6665 60.7143 16.6665H26.7857C25.7995 16.6665 25 17.5992 25 18.7498V31.2498C25 32.4004 25.7995 33.3332 26.7857 33.3332H60.7143C62.6867 33.3332 64.2857 31.4677 64.2857 29.1665V20.8332Z" fill="#F9FAFA"/><path d="M75 45.8332C75 43.532 73.401 41.6665 71.4286 41.6665H26.7857C25.7995 41.6665 25 42.5992 25 43.7498V56.2498C25 57.4004 25.7995 58.3332 26.7857 58.3332H71.4286C73.401 58.3332 75 56.4677 75 54.1665V45.8332Z" fill="#F9FAFA"/><path d="M46.4286 70.8332C46.4286 68.532 44.8296 66.6665 42.8571 66.6665H26.7857C25.7995 66.6665 25 67.5992 25 68.7498V81.2498C25 82.4004 25.7995 83.3332 26.7857 83.3332H42.8571C44.8296 83.3332 46.4286 81.4677 46.4286 79.1665V70.8332Z" fill="#F9FAFA"/></svg>
                <span>Poll</span>
              </div>
              <img src="assets/img/heineken.png" alt="Heineken" class="sponsor">
            </div>
            <div class="timer"><div class="timer-fill" style="width: 84%"></div></div>

            <div class="question-row">
              <div class="question-text">
                <span class="meta">Bundesliga</span>
                <h2>Who wins the league title?</h2>
              </div>
              <button class="collapse-btn" id="collapseBtn" aria-label="Collapse" aria-expanded="true">
                <svg width="28" height="28" viewBox="0 0 17.408 17.408" fill="none" aria-hidden="true"><path d="M0 8.704C0 3.89691 3.89691 0 8.704 0V0C13.5111 0 17.408 3.89691 17.408 8.704V8.704C17.408 13.5111 13.5111 17.408 8.704 17.408V17.408C3.89691 17.408 0 13.5111 0 8.704V8.704Z" fill="#F9FAFA" fill-opacity="0.12"/><path d="M8.73828 5.74889L13.7383 10.7489L12.2361 12.2511L8.73828 8.75332L5.24049 12.2511L3.73828 10.7489L8.73828 5.74889Z" fill-rule="evenodd" clip-rule="evenodd" fill="#F9FAFA"/></svg>
              </button>
            </div>

            <div class="poll-body" id="pollBody">
              <div class="options" id="options"></div>
              <div class="voters">
                <div class="voter-stack">
                  <img src="assets/img/avatars/vulture.png" alt="">
                  <img src="assets/img/avatars/tiger.png" alt="">
                  <img src="assets/img/avatars/b.png" alt="">
                </div>
                <span><span id="votesLabel">10.0K</span> fans voted</span>
              </div>
            </div>
          </section>
        </div>

        <!-- Composer -->
        <div class="composer">
          <label class="message-input">
            <span class="sr-only">Message</span>
            <input placeholder="Message">
            <button class="icon-btn" aria-label="Stickers">
              <svg width="28" height="28" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M21 14L14 21H3V3H21V14ZM5 19H12V16.999C11.1228 16.999 10.2608 16.7695 9.50098 16.3311C8.74045 15.8922 8.10896 15.2604 7.66992 14.5L9.40234 13.5C9.66576 13.9562 10.0447 14.3354 10.501 14.5986C10.9568 14.8616 11.4738 14.999 12 14.999V12H19V5H5V19ZM14 18.1719L18.1719 14H14V18.1719ZM8.5 8C9.32843 8 10 8.67157 10 9.5C10 10.3284 9.32843 11 8.5 11C7.67157 11 7 10.3284 7 9.5C7 8.67157 7.67157 8 8.5 8ZM15.5 8C16.3284 8 17 8.67157 17 9.5C17 10.3284 16.3284 11 15.5 11C14.6716 11 14 10.3284 14 9.5C14 8.67157 14.6716 8 15.5 8Z" fill="#F9FAFA"/></svg>
            </button>
          </label>
          <button class="reaction" aria-label="Cheer"><img src="assets/img/reactions/cheer.png" alt=""></button>
          <button class="reaction" aria-label="Number one"><img src="assets/img/reactions/number-one.png" alt=""></button>
          <button class="reaction" aria-label="Reaction"><img src="assets/img/reactions/reaction-3.png" alt=""></button>
        </div>
      </aside>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
