[build]
  command = "npm run build"
  publish = "dist"

# Same-origin proxy for Yahoo Finance (status 200 = proxy, not redirect).
[[redirects]]
  from = "/yf/*"
  to = "https://query1.finance.yahoo.com/:splat"
  status = 200
  force = true

# SPA fallback.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
