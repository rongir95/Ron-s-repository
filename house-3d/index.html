<title>בית גירשביץ׳</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700&family=Heebo:wght@400;500;600&display=swap">
<style>
/* Layout: full-bleed WebGL stage; frosted drafting-paper panels pinned to the corners, mode switch docked at the bottom */
:root{
  --paper: rgba(250,249,245,.88);
  --paper-solid:#faf9f5;
  --ink:#1d2430;
  --muted:#5d6775;
  --line:rgba(29,36,48,.14);
  --accent:#2f5d8a;
  --accent-ink:#ffffff;
  --stage:#c9d9e6;
  --f-display:"Frank Ruhl Libre","David Libre",Georgia,serif;
  --f-ui:"Heebo","Segoe UI",Arial,sans-serif;
  color-scheme: light;
}
:root[data-night="1"]{
  --paper: rgba(17,22,32,.84);
  --paper-solid:#111620;
  --ink:#eef1f6;
  --muted:#a2acba;
  --line:rgba(255,255,255,.14);
  --accent:#f0c27e;
  --accent-ink:#1a1f29;
  --stage:#0b1220;
  color-scheme: dark;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--stage);color:var(--ink);font-family:var(--f-ui);font-size:14px;overflow:hidden;direction:rtl}
#stage{position:fixed;inset:0}
#stage canvas{display:block;outline:none;touch-action:none}
.labels{position:absolute;inset:0;pointer-events:none;direction:ltr}
.labels>div{left:0;top:0}
.panel{background:var(--paper);backdrop-filter:blur(14px) saturate(1.2);-webkit-backdrop-filter:blur(14px) saturate(1.2);border:1px solid var(--line);border-radius:14px;box-shadow:0 10px 30px rgba(15,25,40,.16);transition:background .4s,color .4s}

.brand{position:fixed;top:calc(16px + env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));padding:14px 18px 14px;max-width:340px}
.eyebrow{font-size:11px;letter-spacing:.14em;color:var(--muted);font-weight:500}
.brand h1{font-family:var(--f-display);font-weight:700;font-size:28px;line-height:1.1;margin:4px 0 2px;text-wrap:balance}
.brand h1 .tag{font-family:var(--f-ui);font-size:13px;font-weight:600;color:var(--accent-ink);background:var(--accent);border-radius:6px;padding:2px 7px;vertical-align:middle;margin-inline-start:6px;direction:ltr;display:inline-block}
.brand .sub{color:var(--muted);font-size:13px}
.stats{display:flex;gap:16px;margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.stat b{display:block;font-size:18px;font-weight:600;font-variant-numeric:tabular-nums}
.stat span{font-size:11px;color:var(--muted)}

.tools{position:fixed;top:calc(16px + env(safe-area-inset-top,0px));left:max(16px,env(safe-area-inset-left,0px));padding:8px;display:flex;flex-direction:column;gap:4px;min-width:170px}
.tools h2{font-size:11px;letter-spacing:.12em;color:var(--muted);font-weight:500;margin:6px 8px 2px}
.tbtn{all:unset;box-sizing:border-box;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:7px 10px;border-radius:9px;cursor:pointer;font-size:13px;color:var(--ink)}
.tbtn:hover{background:var(--line)}
.tbtn:focus-visible,.mbtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sw{width:30px;height:17px;border-radius:9px;background:var(--line);position:relative;flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;top:2px;right:2px;width:13px;height:13px;border-radius:50%;background:var(--paper-solid);box-shadow:0 1px 2px rgba(0,0,0,.3);transition:transform .2s}
.tbtn[aria-pressed="true"] .sw{background:var(--accent)}
.tbtn[aria-pressed="true"] .sw::after{transform:translateX(-13px)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;padding:3px;margin:0 2px 2px;border-radius:10px;background:var(--line)}
.seg button{all:unset;cursor:pointer;text-align:center;padding:6px 6px;border-radius:8px;font-size:13px;color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.seg button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.roomsel{all:unset;box-sizing:border-box;margin:0 2px 2px;padding:7px 10px;border-radius:9px;background:var(--line);color:var(--ink);font:500 13px var(--f-ui);cursor:pointer;width:calc(100% - 4px);appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:14px 50%,9px 50%;background-size:5px 5px;background-repeat:no-repeat}
.roomsel:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.roomsel option,.roomsel optgroup{color:#1d2430;background:#fff}
.cbtn{all:unset;box-sizing:border-box;display:block;width:100%;text-align:center;margin-top:12px;padding:9px 12px;border-radius:10px;background:var(--accent);color:var(--accent-ink);font-weight:600;font-size:13px;cursor:pointer}
.cbtn.alt{background:transparent;color:var(--accent);border:1.5px solid var(--accent);margin-top:8px}
.cbtn:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.focusbar{all:unset;position:fixed;top:calc(16px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:10px;padding:9px 16px;border-radius:999px;cursor:pointer;font-weight:500;font-size:14px;color:var(--ink);background:var(--paper);border:1px solid var(--line);box-shadow:0 10px 30px rgba(15,25,40,.16);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);white-space:nowrap}
.focusbar b{font-weight:600}
.focusbar .back{background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:3px 10px;font-size:12px}
.focusbar:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.views{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:0 2px 2px}
.views .tbtn{justify-content:center;background:var(--line);padding:6px 8px}
.views .tbtn:hover{filter:brightness(.95)}

.modes{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);display:flex;gap:4px;padding:5px;border-radius:999px}
.mbtn{all:unset;cursor:pointer;padding:9px 16px;border-radius:999px;font-weight:500;font-size:14px;white-space:nowrap;color:var(--ink);transition:background .2s,color .2s}
.mbtn:hover{background:var(--line)}
.mbtn[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}

.card{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(84px + env(safe-area-inset-bottom,0px));width:300px;padding:16px 18px}
.card .floor{font-size:11px;letter-spacing:.12em;color:var(--muted)}
.card h3{font-family:var(--f-display);font-size:24px;margin:4px 0 8px;font-weight:700}
.card dl{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:0 0 10px}
.card dt{color:var(--muted);font-size:12px}
.card dd{margin:0;font-weight:600;font-variant-numeric:tabular-nums;direction:ltr;text-align:right}
.card p{margin:0;color:var(--muted);line-height:1.55;font-size:13px}
.card .x{all:unset;position:absolute;top:10px;left:12px;cursor:pointer;font-size:20px;line-height:1;color:var(--muted);padding:4px}

.zoom{position:fixed;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(76px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;padding:4px;gap:2px;border-radius:12px}
.zoom button{all:unset;cursor:pointer;width:40px;height:40px;display:grid;place-items:center;border-radius:9px;color:var(--ink);font:500 22px/1 var(--f-ui)}
.zoom button:hover{background:var(--line)}
.zoom button:active{background:var(--accent);color:var(--accent-ink)}
.zoom button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.zoom hr{border:0;border-top:1px solid var(--line);margin:0 6px}
.hint{position:fixed;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(26px + env(safe-area-inset-bottom,0px));font-size:12px;color:var(--muted);padding:6px 12px;border-radius:999px}

.lbl{display:flex;gap:7px;align-items:baseline;pointer-events:auto;cursor:pointer;background:var(--paper);border:1px solid var(--line);color:var(--ink);border-radius:999px;padding:4px 10px;font:500 12px/1.3 var(--f-ui);white-space:nowrap;box-shadow:0 4px 12px rgba(10,20,30,.15);direction:rtl;transition:background .3s}
.lbl b{font-weight:500}
.lbl span{color:var(--muted);font-variant-numeric:tabular-nums;direction:ltr;font-size:11px}
.lbl.on{background:var(--accent);color:var(--accent-ink)}
.lbl.on span{color:inherit;opacity:.8}

.loading{position:fixed;inset:0;display:grid;place-items:center;background:var(--stage);font-family:var(--f-display);font-size:22px;color:var(--ink);transition:opacity .6s}
.loading.done{opacity:0;pointer-events:none}

@media (max-width:760px){
  .brand{left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));top:calc(10px + env(safe-area-inset-top,0px));max-width:none;padding:10px 14px}
  .brand h1{font-size:21px}
  .stats{gap:12px;margin-top:6px;padding-top:6px}
  .stat b{font-size:15px}
  .tools{top:auto;bottom:calc(76px + env(safe-area-inset-bottom,0px));left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));flex-direction:row;overflow-x:auto;min-width:0;padding:5px;border-radius:12px}
  .tools h2{display:none}
  .tools .tbtn{flex:none;padding:6px 9px}
  .views{display:flex;padding:0}
  .seg{flex:none;margin:0}
  .roomsel{flex:none;width:auto;margin:0;padding-left:26px}
  .focusbar{top:calc(128px + env(safe-area-inset-top,0px));max-width:calc(100% - 24px)}
  .modes{left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));transform:none;justify-content:space-between;bottom:calc(14px + env(safe-area-inset-bottom,0px))}
  .mbtn{padding:8px 10px;font-size:13px;flex:1;text-align:center}
  .card{left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));width:auto;bottom:calc(132px + env(safe-area-inset-bottom,0px))}
  .hint{display:none}
  .zoom{left:auto;right:max(12px,env(safe-area-inset-right,0px));bottom:auto;top:50%;transform:translateY(-50%)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div id="stage"></div>
<div class="loading" id="loading">בונה את הבית…</div>

<header class="brand panel">
  <div class="eyebrow">יקנעם · דגם A-1</div>
  <h1>בית גירשביץ׳</h1>
  <div class="sub">דירה 29 · בית דו-משפחתי בשתי קומות עם חצר צמודה</div>
  <div class="stats">
    <div class="stat"><b id="sG">—</b><span>קומת קרקע, מ״ר</span></div>
    <div class="stat"><b id="sF">—</b><span>קומה א׳, מ״ר</span></div>
    <div class="stat"><b>4</b><span>חדרי שינה</span></div>
    <div class="stat"><b>3</b><span>חדרי רחצה</span></div>
  </div>
</header>

<aside class="tools panel" aria-label="אפשרויות תצוגה">
  <h2>תצוגה</h2>
  <button class="tbtn" id="tNight" aria-pressed="false">תאורת לילה <span class="sw"></span></button>
  <button class="tbtn" id="tLabels" aria-pressed="true">שמות חדרים <span class="sw"></span></button>
  <button class="tbtn" id="tNeighbor" aria-pressed="true">יחידה שכנה A-2 <span class="sw"></span></button>
  <button class="tbtn" id="tRotate" aria-pressed="false">סיבוב אוטומטי <span class="sw"></span></button>
  <h2>קירות</h2>

    <button class="tbtn" data-view="iso">איזומטרי</button>

</aside>

<nav class="modes panel" role="tablist" aria-label="קומות">
  <button class="mbtn" role="tab" data-mode="full" aria-selected="true">בית מלא</button>
  <button class="mbtn" role="tab" data-mode="ground" aria-selected="false">קומת קרקע</button>
  <button class="mbtn" role="tab" data-mode="first" aria-selected="false">קומה א׳</button>
  <button class="mbtn" role="tab" data-mode="exploded" aria-selected="false">פיצוץ קומות</button>

<div class="card panel" id="card" hidden>
  <button class="x" id="cardX" aria-label="סגירה">×</button>
  <div class="floor" id="cFloor"></div>
  <h3 id="cName"></h3>
  <dl>
    <dt>מידות פנים</dt><dd id="cDims"></dd>
    <dt>שטח</dt><dd id="cArea"></dd>
  </dl>
  <p id="cNote"></p>
  <button class="cbtn" id="cFocus">הצגת החדר הזה בלבד</button>
  <button class="cbtn alt" id="cWalk">עמידה בתוך החדר</button>
</div>

<button class="focusbar" id="walkBar" hidden><span class="back">יציאה</span><span>עומדים בתוך <b id="walkName"></b></span></button>
<button class="focusbar" id="focusBar" hidden><span class="back">חזרה לכל הבית</span><span>מבט על <b id="focusName"></b></span></button>

<div class="zoom panel" role="group" aria-label="זום">
  <button id="zIn" aria-label="התקרבות" title="התקרבות (+)">+</button>

</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

/* ============================================================
   Plan coordinates are in centimetres, read off the sales plans:
   X grows to the east (towards the party wall with A-2),
   Y grows to the south (garden at Y<0, street at Y>1050).
   ============================================================ */
const CX = 3.6, CZ = 5.2;
const wx = X => X / 100 - CX, wz = Y => Y / 100 - CZ;
const L1 = 3.1, H1 = 2.8, H2 = 2.75, TOP1 = L1 + H2, ATT = 0.2, ROOF0 = TOP1 + ATT;
const PITCH = 24 * Math.PI / 180, PARTY = 792, GROUND = -0.15;

let seed = 11;
const rnd = () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };

/* ---------------- renderer / scene ---------------- */
const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
stage.appendChild(renderer.domElement);
const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
labelRenderer.domElement.className = 'labels';
stage.appendChild(labelRenderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.1, 1200);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = 0.08;
controls.maxPolarAngle = Math.PI * 0.495; controls.minDistance = 3; controls.maxDistance = 70;
controls.autoRotateSpeed = 0.6;

const pmrem = new THREE.PMREMGenerator(renderer);
const envTex = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environment = envTex;

const skyU = { top: { value: new THREE.Color(0x5d8fc9) }, horizon: { value: new THREE.Color(0xdde8f0) }, bottom: { value: new THREE.Color(0xb9c4a8) } };
const sky = new THREE.Mesh(new THREE.SphereGeometry(500, 32, 16), new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false, toneMapped: false, uniforms: skyU,
  vertexShader: `varying vec3 vP; void main(){ vP = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
  fragmentShader: `uniform vec3 top; uniform vec3 horizon; uniform vec3 bottom; varying vec3 vP;
    void main(){ float h = vP.y; vec3 c = h > 0.0 ? mix(horizon, top, pow(h, 0.55)) : mix(horizon, bottom, pow(min(-h*4.0,1.0), 0.5));
    gl_FragColor = vec4(c, 1.0);
    #include <colorspace_fragment>
    }`
}));
scene.add(sky);
scene.fog = new THREE.Fog(0xdde8f0, 45, 160);

const hemi = new THREE.HemisphereLight(0xdfeaff, 0x7a6a50, 0.9);
scene.add(hemi);
// soft room fill, only on while standing inside a room (daylight bouncing off walls and ceiling)
const roomFill = new THREE.AmbientLight(0xfff6ec, 0);
scene.add(roomFill);
const sun = new THREE.DirectionalLight(0xfff0da, 3.2);
sun.position.set(-14, 22, 15);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -19, right: 19, top: 19, bottom: -19, near: 1, far: 90 });
sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.025;
scene.add(sun);

/* stars for the night sky */
const starGeo = new THREE.BufferGeometry(); const sp = [];
for (let i = 0; i < 1400; i++) { const u = rnd() * 2 - 1, th = rnd() * Math.PI * 2, r = 420; const y = Math.abs(u) * 0.95 + 0.05; const rr = Math.sqrt(1 - y * y); sp.push(Math.cos(th) * rr * r, y * r, Math.sin(th) * rr * r); }
starGeo.setAttribute('position', new THREE.Float32BufferAttribute(sp, 3));
const stars = new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0xffffff, size: 1.3, sizeAttenuation: false, fog: false, transparent: true, opacity: .85 }));
stars.visible = false; scene.add(stars);

/* ---------------- procedural textures ---------------- */
function canvasTex(size, draw, meters, color = true) {
  const c = document.createElement('canvas'); c.width = c.height = size;
  const g = c.getContext('2d'); draw(g, size);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(1 / meters, 1 / meters);
  if (color) t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return t;
}
const speckle = (g, s, n, a, light = false) => { for (let i = 0; i < n; i++) { g.fillStyle = light ? `rgba(255,255,255,${rnd() * a})` : `rgba(0,0,0,${rnd() * a})`; const r = rnd() * 2 + .5; g.fillRect(rnd() * s, rnd() * s, r, r); } };
const hsl = (h, s, l) => `hsl(${h},${s}%,${l}%)`;

const T = {};
T.stone = canvasTex(512, (g, s) => {
  g.fillStyle = '#e7dcc6'; g.fillRect(0, 0, s, s);
  const rows = 4, rh = s / rows;
  for (let r = 0; r < rows; r++) {
    let x = -rnd() * 120;
    while (x < s) {
      const w = 150 + rnd() * 170;
      const col = hsl(36 + rnd() * 8, 30 + rnd() * 14, 70 + rnd() * 9);
      for (const off of [0, -s, s]) {
        const gr = g.createLinearGradient(0, r * rh, 0, r * rh + rh);
        gr.addColorStop(0, col); gr.addColorStop(1, hsl(36, 28, 66 + rnd() * 6));
        g.fillStyle = gr; g.fillRect(x + off + 2, r * rh + 2, w - 4, rh - 4);
      }
      x += w;
    }
  }
  speckle(g, s, 9000, .09); speckle(g, s, 3000, .25, true);
}, 1.2);
T.plaster = canvasTex(256, (g, s) => { g.fillStyle = '#f3f0e9'; g.fillRect(0, 0, s, s); speckle(g, s, 6000, .05); speckle(g, s, 3000, .4, true); }, 1.5);
T.roof = canvasTex(512, (g, s) => {
  const courses = 4, cw = s / courses, tile = s / 5.6;
  for (let c = 0; c < courses; c++) {
    const off = (c % 2) * tile / 2;
    for (let y = -tile; y < s + tile; y += tile) {

/* walls: full height, cut at 1 m (dollhouse), or only a thin footprint on the floor */

/* ---------- single-room view ----------

const focusTouched = [];

/* ---------- standing inside a room ----------

const EYE = 1.6, ORBIT = { min: 3, max: 70, maxPolar: Math.PI * .495, minPolar: 0, fov: 38 };
let walking = null; // { id, back: focus id or null, mode, cam }
function setWalkControls(on) {

    controls.minPolarAngle = Math.PI * .12; controls.maxPolarAngle = Math.PI * .88; controls.rotateSpeed = -.35;

function enterWalk(id) {

document.querySelectorAll('.mbtn').forEach(b => b.addEventListener('click', () => setMode(b.dataset.mode)));
document.querySelectorAll('[data-walls]').forEach(b => b.addEventListener('click', () => setWalls(b.dataset.walls)));

document.getElementById('cardX').addEventListener('click', () => selectRoom(null));
{ // room picker, grouped by floor
  const sel = document.getElementById('roomSel');
  [['קומת קרקע', 0], ['קומה א׳', 1]].forEach(([label, f]) => {
    const og = document.createElement('optgroup'); og.label = label;

document.getElementById('cFocus').addEventListener('click', () => { if (focus && focus === state.sel) exitFocus(); else if (state.sel) focusRoom(state.sel); });
document.getElementById('focusBar').addEventListener('click', () => exitFocus());

/* ---------------- start ---------------- */
const [p0, t0] = VIEWS.iso();
