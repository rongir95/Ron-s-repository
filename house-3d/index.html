<title>בית גירשביץ׳</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700&family=Heebo:wght@400;500;600&display=swap">
<style>
/* Layout: full-bleed WebGL stage; frosted drafting-paper panels pinned to the corners, mode switch docked at the bottom */
:root{
  --paper: rgba(250,249,245,.88);
  --paper-solid:#faf9f5;
  --ink:#1d2430;
  --muted:#5d6775;
  --line:rgba(29,36,48,.14);
  --accent:#2f5d8a;
  --accent-ink:#ffffff;
  --stage:#c9d9e6;
  --f-display:"Frank Ruhl Libre","David Libre",Georgia,serif;
  --f-ui:"Heebo","Segoe UI",Arial,sans-serif;
  color-scheme: light;
}
:root[data-night="1"]{
  --paper: rgba(17,22,32,.84);
  --paper-solid:#111620;
  --ink:#eef1f6;
  --muted:#a2acba;
  --line:rgba(255,255,255,.14);
  --accent:#f0c27e;
  --accent-ink:#1a1f29;
  --stage:#0b1220;
  color-scheme: dark;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--stage);color:var(--ink);font-family:var(--f-ui);font-size:14px;overflow:hidden;direction:rtl}
#stage{position:fixed;inset:0}
#stage canvas{display:block;outline:none;touch-action:none}
.labels{position:absolute;inset:0;pointer-events:none;direction:ltr}
.labels>div{left:0;top:0}
.collapse{all:unset;position:absolute;top:8px;width:26px;height:26px;display:grid;place-items:center;border-radius:8px;cursor:pointer;color:var(--muted);font-size:14px;line-height:1;transition:transform .2s}
.collapse:hover{background:var(--line);color:var(--ink)}
.collapse:focus-visible{outline:2px solid var(--accent)}
.brand .collapse{left:8px}
.tools .collapse{right:6px;top:6px}
.tools h2:first-of-type{padding-right:26px}
.panel.min .collapse{transform:rotate(180deg)}
.brand.min .eyebrow,.brand.min .sub,.brand.min .stats{display:none}
.brand.min{padding-block:8px}
.brand.min h1{font-size:18px;margin:0;padding-inline-end:28px}
.tools.min>*:not(.collapse):not(h2:first-of-type){display:none}
.tools.min{min-width:0;padding:6px 38px 6px 10px}
.tools.min h2:first-of-type{margin:4px 0}
.panel{background:var(--paper);backdrop-filter:blur(14px) saturate(1.2);-webkit-backdrop-filter:blur(14px) saturate(1.2);border:1px solid var(--line);border-radius:14px;box-shadow:0 10px 30px rgba(15,25,40,.16);transition:background .4s,color .4s}

.brand{position:fixed;top:calc(16px + env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));padding:14px 18px 14px;max-width:340px}
.eyebrow{font-size:11px;letter-spacing:.14em;color:var(--muted);font-weight:500}
.brand h1{font-family:var(--f-display);font-weight:700;font-size:28px;line-height:1.1;margin:4px 0 2px;text-wrap:balance}
.brand h1 .tag{font-family:var(--f-ui);font-size:13px;font-weight:600;color:var(--accent-ink);background:var(--accent);border-radius:6px;padding:2px 7px;vertical-align:middle;margin-inline-start:6px;direction:ltr;display:inline-block}
.brand .sub{color:var(--muted);font-size:13px}
.stats{display:flex;gap:16px;margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.stat b{display:block;font-size:18px;font-weight:600;font-variant-numeric:tabular-nums}
.stat span{font-size:11px;color:var(--muted)}

.tools{position:fixed;top:calc(16px + env(safe-area-inset-top,0px));left:max(16px,env(safe-area-inset-left,0px));padding:8px;display:flex;flex-direction:column;gap:4px;min-width:170px}
.tools h2{font-size:11px;letter-spacing:.12em;color:var(--muted);font-weight:500;margin:6px 8px 2px}
.tbtn{all:unset;box-sizing:border-box;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:7px 10px;border-radius:9px;cursor:pointer;font-size:13px;color:var(--ink)}
.tbtn:hover{background:var(--line)}
.tbtn:focus-visible,.mbtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sw{width:30px;height:17px;border-radius:9px;background:var(--line);position:relative;flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;top:2px;right:2px;width:13px;height:13px;border-radius:50%;background:var(--paper-solid);box-shadow:0 1px 2px rgba(0,0,0,.3);transition:transform .2s}
.tbtn[aria-pressed="true"] .sw{background:var(--accent)}
.tbtn[aria-pressed="true"] .sw::after{transform:translateX(-13px)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;padding:3px;margin:0 2px 2px;border-radius:10px;background:var(--line)}
.seg.two{grid-template-columns:1fr 1fr}
.seg button{all:unset;cursor:pointer;text-align:center;padding:6px 6px;border-radius:8px;font-size:13px;color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.seg button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.roomsel{all:unset;box-sizing:border-box;margin:0 2px 2px;padding:7px 10px;border-radius:9px;background:var(--line);color:var(--ink);font:500 13px var(--f-ui);cursor:pointer;width:calc(100% - 4px);appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:14px 50%,9px 50%;background-size:5px 5px;background-repeat:no-repeat}
.roomsel:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.roomsel option,.roomsel optgroup{color:#1d2430;background:#fff}
.cbtn{all:unset;box-sizing:border-box;display:block;width:100%;text-align:center;margin-top:12px;padding:9px 12px;border-radius:10px;background:var(--accent);color:var(--accent-ink);font-weight:600;font-size:13px;cursor:pointer}
.cbtn.alt{background:transparent;color:var(--accent);border:1.5px solid var(--accent);margin-top:8px}
.cbtn:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.focusbar{all:unset;position:fixed;top:calc(16px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:10px;padding:9px 16px;border-radius:999px;cursor:pointer;font-weight:500;font-size:14px;color:var(--ink);background:var(--paper);border:1px solid var(--line);box-shadow:0 10px 30px rgba(15,25,40,.16);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);white-space:nowrap}
.focusbar b{font-weight:600}
.focusbar .back{background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:3px 10px;font-size:12px}
.focusbar:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.views{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:0 2px 2px}
.views .tbtn{justify-content:center;background:var(--line);padding:6px 8px}
.views .tbtn:hover{filter:brightness(.95)}

.modes{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);display:flex;gap:4px;padding:5px;border-radius:999px}
.mbtn{all:unset;cursor:pointer;padding:9px 16px;border-radius:999px;font-weight:500;font-size:14px;white-space:nowrap;color:var(--ink);transition:background .2s,color .2s}
.mbtn:hover{background:var(--line)}
.mbtn[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}

.card{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(84px + env(safe-area-inset-bottom,0px));width:300px;padding:16px 18px}
.card .floor{font-size:11px;letter-spacing:.12em;color:var(--muted)}
.card h3{font-family:var(--f-display);font-size:24px;margin:4px 0 8px;font-weight:700}
.card dl{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:0 0 10px}
.card dt{color:var(--muted);font-size:12px}
.card dd{margin:0;font-weight:600;font-variant-numeric:tabular-nums;direction:ltr;text-align:right}
.card p{margin:0;color:var(--muted);line-height:1.55;font-size:13px}
.card .x{all:unset;position:absolute;top:10px;left:12px;cursor:pointer;font-size:20px;line-height:1;color:var(--muted);padding:4px}

.zoom{position:fixed;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(76px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;padding:4px;gap:2px;border-radius:12px}
.zoom button{all:unset;cursor:pointer;width:40px;height:40px;display:grid;place-items:center;border-radius:9px;color:var(--ink);font:500 22px/1 var(--f-ui)}
.zoom button:hover{background:var(--line)}
.zoom button:active{background:var(--accent);color:var(--accent-ink)}
.zoom button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.zoom hr{border:0;border-top:1px solid var(--line);margin:0 6px}
.splitbar{position:fixed;top:0;bottom:0;width:0;left:50%;z-index:5;pointer-events:none}
.splitbar::before{content:"";position:absolute;top:0;bottom:0;left:-1px;width:2px;background:#fff;box-shadow:0 0 6px rgba(0,0,0,.4)}
.splitbar .knob{pointer-events:auto;position:absolute;top:50%;left:-20px;width:40px;height:40px;margin-top:-20px;border-radius:50%;background:#fff;color:#1d2430;display:grid;place-items:center;font-size:18px;cursor:ew-resize;box-shadow:0 4px 14px rgba(0,0,0,.3);touch-action:none}
.splitbar .tag{position:absolute;top:calc(50% + 30px);padding:3px 9px;border-radius:999px;background:rgba(17,22,32,.75);color:#fff;font-size:12px;white-space:nowrap}
.splitbar .tag.l{right:10px}.splitbar .tag.r{left:10px}
.hint{position:fixed;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(26px + env(safe-area-inset-bottom,0px));font-size:12px;color:var(--muted);padding:6px 12px;border-radius:999px}

.lbl{display:flex;gap:7px;align-items:baseline;pointer-events:auto;cursor:pointer;background:var(--paper);border:1px solid var(--line);color:var(--ink);border-radius:999px;padding:4px 10px;font:500 12px/1.3 var(--f-ui);white-space:nowrap;box-shadow:0 4px 12px rgba(10,20,30,.15);direction:rtl;transition:background .3s}
.lbl b{font-weight:500}
.lbl span{color:var(--muted);font-variant-numeric:tabular-nums;direction:ltr;font-size:11px}
.lbl.on{background:var(--accent);color:var(--accent-ink)}
.lbl.on span{color:inherit;opacity:.8}

.loading{position:fixed;inset:0;display:grid;place-items:center;background:var(--stage);font-family:var(--f-display);font-size:22px;color:var(--ink);transition:opacity .6s}
.loading.done{opacity:0;pointer-events:none}

@media (max-width:760px){
  .brand{left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));top:calc(10px + env(safe-area-inset-top,0px));max-width:none;padding:10px 14px}
  .brand h1{font-size:21px}
  .stats{gap:12px;margin-top:6px;padding-top:6px}
  .stat b{font-size:15px}
  .tools{top:auto;bottom:calc(76px + env(safe-area-inset-bottom,0px));left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));flex-direction:row;overflow-x:auto;min-width:0;padding:5px;border-radius:12px}
  .tools h2{display:none}
  .tools .collapse{position:static;flex:none}
  .tools.min{padding:5px}
  .tools.min h2:first-of-type{display:block;margin:6px 6px}
  .tools .tbtn{flex:none;padding:6px 9px}
  .views{display:flex;padding:0}
  .seg{flex:none;margin:0}
  .roomsel{flex:none;width:auto;margin:0;padding-left:26px}
  .focusbar{top:calc(128px + env(safe-area-inset-top,0px));max-width:calc(100% - 24px)}
  .modes{left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));transform:none;justify-content:space-between;bottom:calc(14px + env(safe-area-inset-bottom,0px))}
  .mbtn{padding:8px 10px;font-size:13px;flex:1;text-align:center}
  .card{left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));width:auto;bottom:calc(132px + env(safe-area-inset-bottom,0px))}
  .hint{display:none}
  .zoom{left:auto;right:max(12px,env(safe-area-inset-right,0px));bottom:auto;top:50%;transform:translateY(-50%)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div id="stage"></div>
<div class="loading" id="loading">בונה את הבית…</div>

<header class="brand panel" id="brandP">
  <button class="collapse" data-col="brandP" aria-label="כיווץ" aria-expanded="true"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M6 15l6-6 6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  <div class="eyebrow">יקנעם · דגם A-1</div>
  <h1>בית גירשביץ׳</h1>
  <div class="sub">דירה 29 · בית דו-משפחתי בשתי קומות עם חצר צמודה</div>
  <div class="stats">
    <div class="stat"><b id="sG">—</b><span>קומת קרקע, מ״ר</span></div>
    <div class="stat"><b id="sF">—</b><span>קומה א׳, מ״ר</span></div>
    <div class="stat"><b>4</b><span>חדרי שינה</span></div>
    <div class="stat"><b>3</b><span>חדרי רחצה</span></div>
  </div>
</header>

<aside class="tools panel" id="toolsP" aria-label="אפשרויות תצוגה">
  <button class="collapse" data-col="toolsP" aria-label="כיווץ" aria-expanded="true"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M6 15l6-6 6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  <h2>תצוגה</h2>
  <button class="tbtn" id="tNight" aria-pressed="false">תאורת לילה <span class="sw"></span></button>
  <button class="tbtn" id="tLabels" aria-pressed="true">שמות חדרים <span class="sw"></span></button>
  <button class="tbtn" id="tNeighbor" aria-pressed="true">יחידה שכנה A-2 <span class="sw"></span></button>
  <button class="tbtn" id="tRotate" aria-pressed="false">סיבוב אוטומטי <span class="sw"></span></button>
  <h2>שיפוץ</h2>
  <div class="seg" role="group" aria-label="לפני או אחרי שיפוץ">
    <button data-reno="before" aria-pressed="true">לפני</button>
    <button data-reno="after" aria-pressed="false">אחרי</button>
    <button data-reno="split" aria-pressed="false">השוואה</button>
  </div>
  <h2>קירות</h2>
  <div class="seg" role="group" aria-label="גובה קירות">
    <button data-walls="full" aria-pressed="true">מלאים</button>
    <button data-walls="low" aria-pressed="false">נמוכים</button>
    <button data-walls="none" aria-pressed="false">ללא</button>
  </div>
  <h2>מבט על חדר</h2>
  <select class="roomsel" id="roomSel" aria-label="בחירת חדר להתמקדות">
    <option value="">בחרו חדר…</option>
  </select>
  <h2>מבט</h2>
  <div class="views">
    <button class="tbtn" data-view="street">חזית</button>
    <button class="tbtn" data-view="garden">גינה</button>
    <button class="tbtn" data-view="top">מבט על</button>
    <button class="tbtn" data-view="iso">איזומטרי</button>
  </div>
</aside>

<nav class="modes panel" role="tablist" aria-label="קומות">
  <button class="mbtn" role="tab" data-mode="full" aria-selected="true">בית מלא</button>
  <button class="mbtn" role="tab" data-mode="ground" aria-selected="false">קומת קרקע</button>
  <button class="mbtn" role="tab" data-mode="first" aria-selected="false">קומה א׳</button>
  <button class="mbtn" role="tab" data-mode="exploded" aria-selected="false">פיצול קומות</button>
</nav>

<div class="card panel" id="card" hidden>
  <button class="x" id="cardX" aria-label="סגירה">×</button>
  <div class="floor" id="cFloor"></div>
  <h3 id="cName"></h3>
  <dl>
    <dt>מידות פנים</dt><dd id="cDims"></dd>
    <dt>שטח</dt><dd id="cArea"></dd>
  </dl>
  <p id="cNote"></p>
  <button class="cbtn" id="cFocus">הצגת החדר הזה בלבד</button>
  <button class="cbtn alt" id="cWalk">עמידה בתוך החדר</button>
</div>

<button class="focusbar" id="walkBar" hidden><span class="back">יציאה</span><span>עומדים בתוך <b id="walkName"></b></span></button>
<button class="focusbar" id="focusBar" hidden><span class="back">חזרה לכל הבית</span><span>מבט על <b id="focusName"></b></span></button>

<div class="zoom panel" role="group" aria-label="זום">
  <button id="zIn" aria-label="התקרבות" title="התקרבות (+)">+</button>
  <hr>
  <button id="zOut" aria-label="התרחקות" title="התרחקות (−)">−</button>
</div>

<div class="splitbar" id="splitBar" hidden><span class="tag l">לפני</span><span class="knob" aria-label="גרירה להשוואה">⟷</span><span class="tag r">אחרי</span></div>

<div class="hint panel" id="hint">גרירה לסיבוב · גלילה לזום · לחיצה כפולה על חדר להצגתו בלבד</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

/* ============================================================
   Plan coordinates are in centimetres, read off the sales plans:
   X grows to the east (towards the party wall with A-2),
   Y grows to the south (garden at Y<0, street at Y>1050).
   ============================================================ */
const CX = 3.6, CZ = 5.2;
const wx = X => X / 100 - CX, wz = Y => Y / 100 - CZ;
const L1 = 3.1, H1 = 2.8, H2 = 2.75, TOP1 = L1 + H2, ATT = 0.2, ROOF0 = TOP1 + ATT;
const PITCH = 24 * Math.PI / 180, PARTY = 792, GROUND = -0.15;

let seed = 11;
const rnd = () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };

/* ---------------- renderer / scene ---------------- */
const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
stage.appendChild(renderer.domElement);
const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
labelRenderer.domElement.className = 'labels';
stage.appendChild(labelRenderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.1, 1200);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = 0.08;
controls.maxPolarAngle = Math.PI * 0.495; controls.minDistance = 3; controls.maxDistance = 70;
controls.autoRotateSpeed = 0.6;

const pmrem = new THREE.PMREMGenerator(renderer);
const envTex = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environment = envTex;

const skyU = { top: { value: new THREE.Color(0x5d8fc9) }, horizon: { value: new THREE.Color(0xdde8f0) }, bottom: { value: new THREE.Color(0xb9c4a8) } };
const sky = new THREE.Mesh(new THREE.SphereGeometry(500, 32, 16), new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false, toneMapped: false, uniforms: skyU,
  vertexShader: `varying vec3 vP; void main(){ vP = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
  fragmentShader: `uniform vec3 top; uniform vec3 horizon; uniform vec3 bottom; varying vec3 vP;
    void main(){ float h = vP.y; vec3 c = h > 0.0 ? mix(horizon, top, pow(h, 0.55)) : mix(horizon, bottom, pow(min(-h*4.0,1.0), 0.5));
    gl_FragColor = vec4(c, 1.0);
    #include <colorspace_fragment>
    }`
}));
scene.add(sky);
scene.fog = new THREE.Fog(0xdde8f0, 45, 160);

const hemi = new THREE.HemisphereLight(0xdfeaff, 0x7a6a50, 0.9);
scene.add(hemi);
// soft room fill, only on while standing inside a room (daylight bouncing off walls and ceiling)
const roomFill = new THREE.AmbientLight(0xfff6ec, 0);
scene.add(roomFill);
const sun = new THREE.DirectionalLight(0xfff0da, 3.2);
sun.position.set(-14, 22, 15);
sun.castShadow = true;

  const eye = new THREE.Vector3(wx(cx), F[r.f].base + EYE, wz(cy));
  flyTo(eye.clone().sub(look.multiplyScalar(.05)), eye, .9);
  document.getElementById('walkName').textContent = r.name; document.getElementById('roomSel').value = roomId;
}
renderer.domElement.addEventListener('pointermove', e => {
  if (!walking || e.buttons) { walkRing.visible = false; return; }
  const h = walkFloorHit(e);
  walkRing.visible = !!h; renderer.domElement.style.cursor = h ? 'pointer' : '';
  if (h) walkRing.position.set(h.point.x, h.point.y + .01, h.point.z);
  walkRing.material.color.set(h && h.stair ? 0xf0c27e : 0xffffff);
});
function exitWalk(goBack = true) {
  walkRing.visible = false; renderer.domElement.style.cursor = '';
  if (!walking) return;
  const w = walking; walking = null;
  setWalkControls(false);
  document.getElementById('walkBar').hidden = true;
  if (!goBack) return;
  if (w.back) { focusRoom(w.back); prevMode = w.mode; prevCam = w.cam; }
  else { setMode(w.mode); if (w.cam) flyTo(w.cam[0], w.cam[1], 1.2); }
}
function exitFocus(restoreMode = true) {
  if (!focus) return;
  focus = null; clearFocusFilters();
  if (autoWalls) { state.walls = 'full'; autoWalls = false; }
  document.getElementById('focusBar').hidden = true;
  document.getElementById('cFocus').textContent = 'הצגת החדר הזה בלבד';
  document.getElementById('roomSel').value = '';
  if (restoreMode) { setMode(prevMode); if (prevCam) flyTo(prevCam[0], prevCam[1], 1.1); } else { applyWalls(); applyLabels(); }
}
function selectRoom(id, fly) {
  ROOMS.forEach(r => { r.mesh.material = r.baseMat; r.el.classList.remove('on'); });
  state.sel = id; const card = document.getElementById('card');
  if (!id) { card.hidden = true; return; }
  const r = ROOMS.find(q => q.id === id);
  if (!r.hl) { r.hl = r.baseMat.clone(); r.hl.emissive = new THREE.Color(0x2f6fb0); r.hl.emissiveIntensity = .35; }
  r.mesh.material = r.hl; r.el.classList.add('on');
  document.getElementById('cFloor').textContent = r.f === 0 ? 'קומת קרקע' : 'קומה א׳';
  document.getElementById('cName').textContent = r.name;
  document.getElementById('cDims').textContent = `${r.dims[0]} × ${r.dims[1]} ס״מ`;
  document.getElementById('cArea').textContent = `${(r.dims[0] * r.dims[1] / 1e4).toFixed(1)} מ״ר`;
  document.getElementById('cNote').textContent = state.reno && r.afterNote ? r.afterNote : r.note;
  card.hidden = false;
  if (fly) {
    const [x0, y0, x1, y1] = r.rect, base = r.f === 0 ? 0 : L1 + (state.mode === 'exploded' ? targets.f1 : 0);
    const tgt = new THREE.Vector3(wx((x0 + x1) / 2), base + .6, wz((y0 + y1) / 2));
    const dir = camera.position.clone().sub(controls.target); if (dir.y / dir.length() < .6) dir.y = dir.length() * .9;
    flyTo(tgt.clone().add(dir.setLength(9)), tgt, 1.0);
  }
}

document.querySelectorAll('.mbtn').forEach(b => b.addEventListener('click', () => setMode(b.dataset.mode)));
document.querySelectorAll('[data-walls]').forEach(b => b.addEventListener('click', () => setWalls(b.dataset.walls)));
document.querySelectorAll('[data-view]').forEach(b => b.addEventListener('click', () => { if (walking) exitWalk(false); const [p, t] = VIEWS[b.dataset.view](); if (b.dataset.view === 'top' && state.mode === 'full') setMode('ground'); flyTo(p, t, 1.4); }));
const tog = (id, key, fn) => { const el = document.getElementById(id); el.addEventListener('click', () => { state[key] = !state[key]; el.setAttribute('aria-pressed', state[key]); fn(); }); };
tog('tNight', 'night', applyNight);
tog('tLabels', 'labels', applyLabels);
tog('tNeighbor', 'neighbor', applyNeighbor);
tog('tRotate', 'rotate', () => controls.autoRotate = state.rotate);
document.getElementById('cardX').addEventListener('click', () => selectRoom(null));
/* before / after renovation: swaps the room groups and floors in place, camera stays where it is */
function renoVisual(on) {
  renoSets.forEach(r => { r.before.visible = !on; if (r.after) r.after.visible = on; });
  ROOMS.forEach(r => { if (!r.afterMat) return; if (r.mesh.material !== r.hl || state.split) r.mesh.material = M[on ? r.afterMat : r.mat]; });
}
function setReno(on, split = false) {
  state.reno = on; state.split = split;
  ROOMS.forEach(r => { if (r.afterMat) { r.baseMat = M[on ? r.afterMat : r.mat]; delete r.hl; r.mesh.material = r.baseMat; } });
  renoVisual(on);
  document.querySelectorAll('[data-reno]').forEach(b => b.setAttribute('aria-pressed', split ? b.dataset.reno === 'split' : (b.dataset.reno === 'after') === on));
  document.getElementById('splitBar').hidden = !split;
  if (state.sel && !walking) selectRoom(state.sel, false);
}
document.querySelectorAll('[data-reno]').forEach(b => b.addEventListener('click', () => b.dataset.reno === 'split' ? setReno(true, true) : setReno(b.dataset.reno === 'after')));
// before / after split: the screen is divided at splitX, left half before, right half after
let splitX = .5;
{ const bar = document.getElementById('splitBar'), knob = bar.querySelector('.knob'); let drag = false;
  const place = () => { bar.style.left = (splitX * 100) + '%'; };
  knob.addEventListener('pointerdown', e => { drag = true; knob.setPointerCapture(e.pointerId); e.preventDefault(); });
  knob.addEventListener('pointermove', e => { if (!drag) return; splitX = THREE.MathUtils.clamp(e.clientX / innerWidth, .05, .95); place(); });
  knob.addEventListener('pointerup', () => drag = false); place(); }
document.querySelectorAll('[data-col]').forEach(btn => {
  const panel = document.getElementById(btn.dataset.col), key = 'col_' + btn.dataset.col;
  const set = min => { panel.classList.toggle('min', min); btn.setAttribute('aria-expanded', !min); btn.setAttribute('aria-label', min ? 'הרחבה' : 'כיווץ'); try { localStorage.setItem(key, min ? '1' : ''); } catch (e) {} };
  try { if (localStorage.getItem(key)) set(true); } catch (e) {}
  btn.addEventListener('click', () => set(!panel.classList.contains('min')));
});
{ // room picker, grouped by floor
  const sel = document.getElementById('roomSel');
  [['קומת קרקע', 0], ['קומה א׳', 1]].forEach(([label, f]) => {
    const og = document.createElement('optgroup'); og.label = label;
    ROOMS.filter(r => r.f === f).forEach(r => { const o = document.createElement('option'); o.value = r.id; o.textContent = r.name; og.appendChild(o); });
    sel.appendChild(og);
  });
  sel.addEventListener('change', () => sel.value ? focusRoom(sel.value) : exitFocus());
}
document.getElementById('cFocus').addEventListener('click', () => { if (focus && focus === state.sel) exitFocus(); else if (state.sel) focusRoom(state.sel); });
document.getElementById('focusBar').addEventListener('click', () => exitFocus());
function zoomBy(f) {
  if (walking) {
    const back = controls.maxDistance;
    if (f > 1) {
      if (camera.fov < 100) camera.fov = Math.min(100, camera.fov * 1.14);
      else controls.minDistance = controls.maxDistance = Math.min(walkRoomMaxBack(), back + .4);   // step back, staying inside the room
    } else {
      if (back > .06) controls.minDistance = controls.maxDistance = Math.max(.05, back - .4);
      else camera.fov = Math.max(30, camera.fov * .88);
    }
    camera.updateProjectionMatrix(); return;
  }
  const base = camTween ? camTween.p1.clone().sub(camTween.t1) : camera.position.clone().sub(controls.target);
  const tgt = camTween ? camTween.t1.clone() : controls.target.clone();
  const len = THREE.MathUtils.clamp(base.length() * f, controls.minDistance, controls.maxDistance);
  flyTo(tgt.clone().add(base.setLength(len)), tgt, .45);
}
// hold a button to keep zooming
for (const [id, f] of [['zIn', .8], ['zOut', 1.25]]) {
  const el = document.getElementById(id); let timer = null;
  const stop = () => { clearInterval(timer); timer = null; };
  el.addEventListener('pointerdown', e => { e.preventDefault(); zoomBy(f); stop(); timer = setInterval(() => zoomBy(f), 260); });
  ['pointerup', 'pointerleave', 'pointercancel'].forEach(t => el.addEventListener(t, stop));
  el.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); zoomBy(f); } });
}
window.addEventListener('keydown', e => {
  if (e.target.closest && e.target.closest('input,textarea')) return;
  const map = { '1': 'full', '2': 'ground', '3': 'first', '4': 'exploded' };
  if (map[e.key]) setMode(map[e.key]);
  if (e.key === 'n' || e.key === 'N') document.getElementById('tNight').click();
  if (e.key === 'r' || e.key === 'R') setReno(!state.reno);
  if (e.key === 'Escape') { if (walking) exitWalk(); else if (focus) exitFocus(); else selectRoom(null); }
  if (e.key === '+' || e.key === '=') zoomBy(.8);
  if (e.key === '-' || e.key === '_') zoomBy(1.25);
  if (e.key === 'w' || e.key === 'W') setWalls({ full: 'low', low: 'none', none: 'full' }[state.walls]);
});

const ray = new THREE.Raycaster(), ptr = new THREE.Vector2(); let down = null;
const visibleChain = o => { while (o) { if (!o.visible) return false; o = o.parent; } return true; };
renderer.domElement.addEventListener('pointerdown', e => { down = [e.clientX, e.clientY]; camTween = null; });
function pickRoom(e) {
  ptr.set(e.clientX / innerWidth * 2 - 1, -e.clientY / innerHeight * 2 + 1); ray.setFromCamera(ptr, camera);
  const hits = ray.intersectObjects([F[0].group, F[1].group, roofG], true).filter(h => visibleChain(h.object) && h.object.material !== M.glass && !(h.object.isPoints));
  for (const h of hits) {
    if (h.object.userData.room) return h.object.userData.room;
    // furniture or walls: find the room whose rectangle contains the hit point
    const X = (h.point.x + CX) * 100, Y = (h.point.z + CZ) * 100, lvl = h.point.y > L1 - .05 + (F[1].group.position.y) ? 1 : 0;
    const r = ROOMS.find(q => q.f === lvl && X >= q.rect[0] && X <= q.rect[2] && Y >= q.rect[1] && Y <= q.rect[3]);
    return r && state.mode !== 'full' ? r.id : null;
  }
  return null;
}
renderer.domElement.addEventListener('pointerup', e => {
  if (!down || Math.hypot(e.clientX - down[0], e.clientY - down[1]) > 6) return;
  if (walking) {
    const h = walkFloorHit(e); if (!h) return;
    if (h.stair) { // take the stairs to the other floor
      const up = ROOMS.find(q => q.id === walking.id).f === 0;
      const [X, Y, id] = up ? [412, 360, 'hall'] : [373, 560, 'foyer'];
      walkTo(new THREE.Vector3(wx(X), 0, wz(Y)), id);
    } else walkTo(h.point, h.room);
    return;
  }
  const id = pickRoom(e); if (id || !focus) selectRoom(id, false);
});
renderer.domElement.addEventListener('dblclick', e => { if (walking) return; const id = pickRoom(e); if (id) (focus === id ? enterWalk(id) : focusRoom(id)); });
renderer.domElement.addEventListener('wheel', e => { if (!walking) return; e.preventDefault(); zoomBy(e.deltaY < 0 ? .9 : 1.1); }, { passive: false });
document.getElementById('cWalk').addEventListener('click', () => { if (state.sel) enterWalk(state.sel); });
document.getElementById('walkBar').addEventListener('click', () => exitWalk());

function resize() {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight); labelRenderer.setSize(innerWidth, innerHeight);
}
window.addEventListener('resize', resize);

/* ---------------- start ---------------- */
const [p0, t0] = VIEWS.iso();
camera.position.copy(p0.clone().multiplyScalar(2.1).add(new THREE.Vector3(10, 8, 0))); controls.target.copy(t0);
flyTo(p0, t0, 2.4);
setMode('full'); camTween = null; flyTo(p0, t0, 2.4);
applyNight(); applyLabels();
document.getElementById('loading').classList.add('done');

const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), .05), k = 1 - Math.pow(.002, dt);
  F[1].group.position.y += (targets.f1 - F[1].group.position.y) * k;
  roofG.position.y += (targets.roof - roofG.position.y) * k;
  if (camTween) {
    const t = Math.min(1, (performance.now() - camTween.s) / camTween.d), e = ease(t);
    camera.position.lerpVectors(camTween.p0, camTween.p1, e); controls.target.lerpVectors(camTween.t0, camTween.t1, e);
    if (t >= 1) camTween = null;
  }
  controls.update();
  if (state.split) {
    const W = innerWidth, H = innerHeight, x = Math.round(W * splitX);
    renderer.setScissorTest(true);
    renoVisual(false); renderer.setScissor(0, 0, x, H); renderer.render(scene, camera);
    renoVisual(true); renderer.setScissor(x, 0, W - x, H); renderer.render(scene, camera);
    renderer.setScissorTest(false);
  } else renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
});
window.__ready = true;
</script>
