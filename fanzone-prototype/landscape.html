<script>
(function () {
  var q = new URLSearchParams(location.search), v = q.get("v") || "current";
  if (v !== "share") return;
  var $ = function (id) { return document.getElementById(id); };
  $("bmw").src = "assets/landscape/bmw.png";
  var sm = $("sm"); sm.hidden = false;
  var OUT = "cubic-bezier(0.2, 0.8, 0.2, 1)", STD = "cubic-bezier(0.4, 0, 0.2, 1)";
  // Apple-style bounce (spring duration .5, bounce .6), as in the Share moment spec
  function bounce(peak, d, b) {
    var w = 2 * Math.PI / d, z = 1 - b, wd = w * Math.sqrt(1 - z * z), tPeak = Math.atan(wd / (z * w)) / wd;
    var A = peak / (Math.exp(-z * w * tPeak) * Math.sin(wd * tPeak)), kf = [];
    for (var i = 0; i <= 30; i++) { var t = i / 30 * .8; kf.push({ transform: "scale(" + (i === 30 ? 1 : 1 + A * Math.exp(-z * w * t) * Math.sin(wd * t)).toFixed(4) + ")", offset: i / 30 }); }
    return kf;
  }
  var T = [
    ["btn", [{ opacity: 0 }, { opacity: 1 }], 900, 120, "linear"],
    ["btn", bounce(.25, .5, .6), 900, 800, "linear"],
    ["btn", [{ width: "32px" }, { width: "209px" }], 1900, 400, STD],
    ["labelClip", [{ maxWidth: "0px" }, { maxWidth: "120px" }], 1900, 400, STD],
    ["label", [{ opacity: 0 }, { opacity: 1 }], 2050, 250, "linear"],
    ["card", [{ opacity: 0 }, { opacity: 1 }], 2800, 240, "linear"],
    ["card", [{ transform: "translateY(16px) scale(.94)" }, { transform: "none" }], 2800, 380, OUT],
    ["head", [{ opacity: 0, transform: "translateY(4px)" }, { opacity: 1, transform: "none" }], 2920, 280, OUT],
    ["moment", [{ opacity: 0 }, { opacity: 1 }], 2980, 260, "linear"],
    ["momentVid", [{ transform: "scale(1.08)" }, { transform: "none" }], 2980, 360, OUT]
  ];
  var anims = [], exit = null, again = 0;
  function play() {
    clearTimeout(again);
    if (exit) { exit.cancel(); exit = null; }
    sm.style.pointerEvents = "";
    anims.forEach(function (a) { a.cancel(); });
    anims = T.map(function (t) { return $(t[0]).animate(t[1], { delay: t[2], duration: t[3], easing: t[4], fill: "both" }); });
    var mv = $("momentVid"); try { mv.currentTime = 12; mv.play(); } catch (e) {}
  }
  // the X closes it; it comes back a few seconds later so the page keeps showing the feature
  $("closeBtn").addEventListener("click", function () {
    if (exit) return;
    exit = sm.animate([{ opacity: 1, transform: "none" }, { opacity: 0, transform: "translateY(8px) scale(.96)" }], { duration: 220, easing: "cubic-bezier(0.4, 0, 1, 1)", fill: "forwards" });
    sm.style.pointerEvents = "none";
    again = setTimeout(play, 4000);
  });
  play();
})();
</script>
