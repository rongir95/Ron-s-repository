# Publishes the stock portfolio dashboard to GitHub Pages.
#
# Pages serves static files with no /yf proxy of its own, so the build is
# pinned to the relay transport — the same Yahoo Finance prices, fetched
# through a public CORS relay, with no API key. Settings offers the other
# sources if a relay is down.
name: Deploy dashboard

on:
  push:
    branches: [claude/stock-portfolio-dashboard-62dg6u]
    paths:
      - 'stock-portfolio-dashboard/**'
      - '.github/workflows/deploy-dashboard.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push supersedes one still in flight.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: stock-portfolio-dashboard/package-lock.json

      - name: Install
        working-directory: stock-portfolio-dashboard
        run: npm ci

      - name: Check the portfolio maths
        working-directory: stock-portfolio-dashboard
        run: npm test

      # The site lives at /Ron-s-repository/, so assets must resolve from there.
      - name: Build
        working-directory: stock-portfolio-dashboard
        env:
          VITE_DEFAULT_PROVIDER: yahoo-relay
        run: npm run build -- --base=/Ron-s-repository/

      # enablement: true turns Pages on if it is not already.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: stock-portfolio-dashboard/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
